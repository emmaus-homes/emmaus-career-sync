name: Update Careers Page

on:
  # Run daily at 6:00 AM Central Time (11:00 UTC)
  schedule:
    - cron: '0 11 * * *'

  # Manual trigger - run anytime from GitHub Actions tab
  workflow_dispatch:
    inputs:
      force_update:
        description: 'Force update even if no changes detected'
        required: false
        default: 'false'
        type: boolean

permissions:
  contents: write

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: ./scraper
        run: npm install

      - name: Install Playwright browsers
        working-directory: ./scraper
        run: npx playwright install chromium --with-deps

      - name: Run scraper
        id: scrape
        working-directory: ./scraper
        run: npm run scrape

      - name: Commit and push jobs.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add jobs.json
          if git diff --staged --quiet; then
            echo "No changes to jobs.json"
          else
            git commit -m "Update jobs.json - $(date -u '+%Y-%m-%d %H:%M UTC')"
            git push
          fi

      - name: Upload debug screenshot
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: debug-screenshot
          path: ./scraper/debug-screenshot.png
          retention-days: 7

      - name: Summary
        run: |
          echo "## Careers Page Update" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Jobs found:** ${{ steps.scrape.outputs.jobs_count || 'N/A' }}" >> $GITHUB_STEP_SUMMARY
          echo "- **New positions:** ${{ steps.scrape.outputs.new_jobs || '0' }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Removed positions:** ${{ steps.scrape.outputs.removed_jobs || '0' }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Updated at: $(date -u)" >> $GITHUB_STEP_SUMMARY
